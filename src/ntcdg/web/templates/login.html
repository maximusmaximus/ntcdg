{% extends "base.html" %}
{% block title %}Log in — NTCDG{% endblock %}
{% block content %}
<section class="narrow card-panel">
  <h1>Log in</h1>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input name="username" required autocomplete="username" value="{{ form.username or '' }}">
    </label>
    <label>Password
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="/signup">Create a profile</a>.</p>
</section>
{% endblock %}
